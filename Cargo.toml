[workspace]
members = [
    "apps/cli",
    "crates/cache_engine", "crates/context_resolver", "crates/context_signatures",
    "crates/cost_estimator",
    "crates/indexer",
    "crates/mcp_router",
    "crates/fact_engine", "crates/packet_engine", "crates/skill_engine", "crates/symbol_extractor",
    "crates/tool_registry",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/ankit1057/kosh"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
